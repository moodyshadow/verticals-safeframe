name: gaming
display_name: "Gaming News & Culture"
description: "For channels covering gaming news, esports, game releases, and gaming culture."

script:
  tone: "energetic, opinionated, community insider, knows the references"
  pacing: "fast and punchy, meme aware, gen z friendly without trying too hard"
  perspective: "first person, fellow gamer talking to gamers"
  word_count: "140 to 165"
  sentence_style: "very short sentences, fragments okay for emphasis, rhetorical questions work"

  # Mood variants — same pattern as hooks/cta_variants: the LLM picks the one
  # whose "when" best fits today's specific story, and lets it shape word
  # choice/energy through the WHOLE script (not just the hook or CTA line).
  # Added because every gaming script defaulted to the same "energetic,
  # opinionated" tone regardless of whether the story actually called for
  # hype, outrage, or something more measured — a leak/rumor and a
  # community-drama story shouldn't read identically.
  mood_variants:
    - id: hype
      description: "genuinely excited, fast, can't-believe-it energy"
      when: "good news for players: a great update, surprise reveal, beloved feature returning"
    - id: outraged
      description: "sharp, indignant, calling out a bad decision directly"
      when: "anti-consumer move, greedy monetization, broken promise, bad corporate decision"
    - id: sarcastic
      description: "dry, mocking, deadpan roast of corporate spin or hypocrisy"
      when: "a company says something absurd, a transparent PR excuse, obvious doublespeak"
    - id: concerned
      description: "measured, slightly worried, thinking about what this means long-term"
      when: "a trend or decision with troubling implications that aren't fully playing out yet"
    - id: nostalgic
      description: "warm, wistful, fond memory energy before snapping back to the news"
      when: "a classic game revival, remaster, or story that calls back to an older era"

  hooks:
    - id: outrage
      template: "{company} just did the one thing nobody wanted. And it's worse than you think."
      when: "negative news, unpopular corporate decision, anti consumer move"
    - id: hype
      template: "This changes {game} forever. I'm not exaggerating."
      when: "major update, surprise announcement, leak confirmed"
    - id: drama
      template: "The {game} community is at war right now. Here's what happened."
      when: "community controversy, pro player drama, dev vs player conflict"
    - id: comparison
      template: "{game_a} just killed {game_b}. Here are the numbers."
      when: "player count shifts, new game launch eating market share"
    - id: leak
      template: "This was NOT supposed to get out. But here we are."
      when: "leaked content, datamined info, insider information"
    - id: nostalgia
      template: "Remember when {game} was actually good? That version might be coming back."
      when: "classic game revival, remaster, spiritual successor"
    - id: hot_take
      template: "Unpopular opinion: {take}. And I can prove it."
      when: "contrarian position that can be backed with evidence"

  cta_variants:
    # 2026-09-04: was hardcoded to ALWAYS use stay_overclocked verbatim on
    # every video — real data showed 0 comments across all 11 published
    # videos despite that CTA explicitly asking for them. A generic "what
    # topic next" ask that never references what the video was actually
    # about is easy to scroll past. pick_a_side/prediction ask a specific,
    # low-effort question tied to today's real subject instead — the bet is
    # that specificity is what was missing, not the ask itself.
    # 2026-09-08: pick_a_side/prediction never actually said "subscribe" out
    # loud — only the stay_overclocked fallback did. The visual subscribe
    # button still popped up on every video (its timing is keyed off the
    # word "comment", not "subscribe"), but with no matching audio/caption
    # ask, most videos were showing a silent button nobody was told to tap.
    # Added a short subscribe clause to all three so every video reinforces
    # it verbally, not just the fallback.
    - id: pick_a_side
      template: "Team {side_a} or team {side_b}? Comment your pick, and subscribe for more."
      when: "the story has two clear, nameable opposing camps/positions (two games, two studios, devs vs players) that a viewer could quickly take a side on"
    - id: prediction
      template: "Comment your prediction: does {subject} actually happen, or does this fall apart? I'll pin the best one. Subscribe for more."
      when: "the story is still unresolved/developing (a rumor not yet confirmed, a release not yet out, a controversy not yet settled) so a viewer could plausibly guess the outcome"
    - id: stay_overclocked
      template: "Let me know in the comments what topic you'd like us to cover next. Subscribe to stay overclocked on the latest gaming news."
      when: "fallback — use only when neither pick_a_side nor prediction genuinely fits the story (no clear two-sided angle and nothing left unresolved to predict)"

  forbidden_phrases:
    - "what's up gamers"
    - "before we get into it"
    - "this video is sponsored by"
    - "raid shadow legends"

  structure:
    opening: "Hook with emotion or surprise. One sentence that makes them stop scrolling."
    middle: "Context, then escalation. Each fact should make the story bigger or worse. Use 'but wait, it gets better' or 'and then THIS happened' as transitions."
    closing: "Strong take. Not neutral. Pick a side. Then CTA."

visuals:
  # Gaming stories are usually about a specific, copyrighted game — no free
  # stock site can legally have real screenshots of it, so a stock search
  # for those beats only ever returns generic "gaming vibes" filler. But
  # plenty of beats in a gaming-news script are generic real-world scenes
  # (a fire marshal, a crowd, a convention hall exterior) that real stock
  # footage covers fine and more reliably than AI generation (e.g. the
  # "fire marshal speaking with staff" AnimateDiff clip that came out with
  # a garbled ghost-limb artifact from motion-interpolating across an
  # incoherent scene change — a stock clip wouldn't have that failure mode
  # at all). Try stock first per-prompt, same as entertainment/tech — it
  # naturally falls through to AI generation for the specific/copyrighted
  # beats where no real stock match exists.
  stock_source: "pexels_first"
  style: "vibrant, high contrast, game aesthetic inspired, dark backgrounds with colorful accents"
  mood: "energetic, dramatic, slightly chaotic"
  color_palette: ["#0D0D0D", "#1A0033", "#FF4444", "#FFD700", "#00BFFF"]

  subjects:
    prefer:
      - "dramatic game screenshot with volumetric lighting"
      - "controller or keyboard macro shot with RGB lighting"
      - "esports stage or tournament arena atmosphere"
      - "game character in cinematic pose"
      - "split screen comparison of two games"
      - "player reaction or crowd celebration"
    avoid:
      - "generic stock gamer at desk"
      - "cartoon/chibi game characters"
      - "mobile gaming imagery"
      - "overly corporate esports branding"

  prompt_suffix: "gaming aesthetic, dramatic lighting, high contrast, cinematic, vibrant colors, 4K quality"

voice:
  pace: "fast, approximately 170 words per minute, slightly breathless energy"
  energy: "high energy, excited but genuine, not forced hype"
  style: "think TheScore Esports narrator meets Dunkey's pacing"

  suggested_voices:
    edge_tts:
      en: "en-US-RogerNeural"
      hi: "hi-IN-MadhurNeural"
    elevenlabs:
      voice_id: "JBFqnCBsd6RMkjVDRZzb"
      settings:
        stability: 0.35
        similarity_boost: 0.80
        style: 0.45
    "60db":
      voice_id: "fbb75ed2-975a-40c7-9e06-38e30524a9a1"
      settings:
        stability: 35
        similarity: 80
        speed: 1.05
        enhance: true

captions:
  highlight_color: "#FFD700"
  text_color: "#FFFFFF"
  font_family: "Arial Black"
  font_size: 68
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"
  words_per_group: 3

music:
  mood: "electronic, upbeat, slightly aggressive, no lyrics, gaming montage energy"
  energy: "high"
  tags: ["electronic", "gaming", "montage", "hype", "bass"]
  duck_volume_speech: 0.10
  duck_volume_gap: 0.25

thumbnail:
  style: "dark background, bold colored text, game artwork or character focus, high energy composition"
  text_color: "#FFFFFF"
  accent_color: "#FF4444"
  text_position: "center_or_left"
  max_words: 4
  font_style: "bold impact style, slightly tilted acceptable"
  guidelines:
    - "4 words max, all caps for emphasis"
    - "Red and yellow outperform other colors in gaming thumbnails"
    - "Show a face (reaction) or a game character, never generic imagery"
    - "Arrows and circles are cliche but still work in gaming niche"

discovery:
  reddit:
    subreddits: ["gaming", "Games", "pcgaming", "VALORANT", "leagueoflegends", "apexlegends", "FortNiteBR", "esports"]
  rss:
    feeds:
      - "https://kotaku.com/rss"
      - "https://www.polygon.com/rss/index.xml"
  google_trends:
    category: "games"
    geo: ""
  youtube_trending:
    category_id: "20"
