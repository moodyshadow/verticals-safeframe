name: tech
display_name: "Tech & AI News"
description: "For channels covering technology, AI, startups, and product launches."

# ─────────────────────────────────────────────────────
# Script Intelligence
# ─────────────────────────────────────────────────────
script:
  tone: "informed, slightly opinionated, conversational but never condescending"
  pacing: "fast and dense with facts, no filler words, no throat clearing"
  perspective: "first person, talking directly to viewer as a peer"
  word_count: "150 to 170"
  sentence_style: "short punchy sentences, occasional longer one for rhythm, never more than two clauses"

  # Mood variants — same pattern as hooks/cta_variants: the LLM picks the one
  # whose "when" best fits today's specific story, and lets it shape word
  # choice/energy through the WHOLE script (not just the hook or CTA line).
  # Added because every tech script defaulted to the same "informed, slightly
  # opinionated" tone regardless of whether the story actually called for
  # excitement, alarm, or skepticism — a genuine breakthrough and a privacy
  # scandal shouldn't read identically.
  mood_variants:
    - id: excited
      description: "genuinely impressed, fast, can't-believe-the-numbers energy"
      when: "a real technical breakthrough, an impressive product/benchmark, something that actually delivers"
    - id: skeptical
      description: "raised-eyebrow, questioning the marketing claim before accepting it"
      when: "an overhyped announcement, a vague benchmark, a claim that doesn't hold up to scrutiny"
    - id: alarmed
      description: "serious, urgent, this-actually-matters energy without being alarmist for its own sake"
      when: "a privacy breach, security flaw, or decision with real downside for users"
    - id: analytical
      description: "calm, measured, walking through the reasoning step by step"
      when: "a complex topic that needs explaining more than reacting to"
    - id: sarcastic
      description: "dry, mocking, deadpan roast of corporate doublespeak or spin"
      when: "a company's statement is transparent PR spin or contradicts its own actions"

  hooks:
    - id: contrarian_take
      template: "On paper, {topic} sounds like a win. In practice? Not so much."
      when: "topic has strong positive consensus, use to create tension"
    - id: breaking_news
      template: "This just happened and nobody is talking about it."
      when: "very recent event, first 24 hours"
    - id: prediction
      template: "{topic} changes everything. Here's what happens next."
      when: "major announcement or product launch with downstream implications"
    - id: explainer
      template: "Let me explain {topic} in 60 seconds because most people are getting this wrong."
      when: "complex topic with widespread misunderstanding"
    - id: comparison
      template: "{thing_a} vs {thing_b}. One of these wins and it's not close."
      when: "two competing products, companies, or approaches"
    - id: statistic_shock
      template: "{shocking_stat}. That number should scare you. Here's why."
      when: "topic has a surprising data point"
    - id: question
      template: "Why did {company} just {action}? The answer is wilder than you think."
      when: "corporate decision that seems irrational on the surface"
    - id: countdown
      template: "You have {timeframe} before {consequence}. Here's what you need to know."
      when: "deadline driven topic, regulation, deprecation, market shift"

  cta_variants:
    # 2026-09-04: was hardcoded to ALWAYS use stay_overclocked verbatim on
    # every video — real data showed 0 comments across all 11 published
    # videos despite that CTA explicitly asking for them. A generic "what
    # topic next" ask that never references what the video was actually
    # about is easy to scroll past. pick_a_side/prediction ask a specific,
    # low-effort question tied to today's real subject instead — the bet is
    # that specificity is what was missing, not the ask itself.
    # 2026-09-08: pick_a_side/prediction never actually said "subscribe" out
    # loud — only the stay_overclocked fallback did. The visual subscribe
    # button still popped up on every video (its timing is keyed off the
    # word "comment", not "subscribe"), but with no matching audio/caption
    # ask, most videos were showing a silent button nobody was told to tap.
    # Added a short subscribe clause to all three so every video reinforces
    # it verbally, not just the fallback.
    - id: pick_a_side
      template: "Team {side_a} or team {side_b}? Comment your pick, and subscribe for more."
      when: "the story has two clear, nameable opposing camps/positions (two products, two companies, two approaches) that a viewer could quickly take a side on"
    - id: prediction
      template: "Comment your prediction: does {subject} actually deliver, or does this fall apart? I'll pin the best one. Subscribe for more."
      when: "the story is still unresolved/developing (an announcement not yet shipped, a lawsuit not yet decided, a plan not yet executed) so a viewer could plausibly guess the outcome"
    - id: stay_overclocked
      template: "Let me know in the comments what topic you'd like us to cover next. Subscribe to stay overclocked on the latest tech news."
      when: "fallback — use only when neither pick_a_side nor prediction genuinely fits the story (no clear two-sided angle and nothing left unresolved to predict)"

  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "what's up guys"
    - "without further ado"
    - "in this video"
    - "hey everyone"

  structure:
    opening: "Hook in first 3 seconds. No intro, no greeting, straight into the tension."
    middle: "3 to 4 key facts from research, each building on the last. Use 'here's the thing' or 'but it gets worse' as transition phrases."
    closing: "Strong opinion or prediction. Then CTA. Never end on a question without answering it first."

# ─────────────────────────────────────────────────────
# Visual Intelligence
# ─────────────────────────────────────────────────────
visuals:
  style: "clean, minimal, dark backgrounds with neon or electric blue accents"
  mood: "futuristic, sleek, professional, slightly ominous for negative stories"
  color_palette: ["#0A0A0F", "#1A1A2E", "#00FF88", "#4ECDC4", "#FF6B6B"]

  subjects:
    prefer:
      - "close up of code on a dark screen with syntax highlighting"
      - "server room with blue LED lighting"
      - "minimalist product shot on dark background"
      - "abstract data visualization with glowing nodes"
      - "circuit board macro shot with shallow depth of field"
      - "person silhouette against massive screen display"
      - "holographic UI overlay on dark background"
    avoid:
      - "stock photo of person smiling at laptop"
      - "generic office environment"
      - "clipart or illustrated icons"
      - "bright cheerful colors"
      - "people shaking hands"

  prompt_suffix: "photorealistic, cinematic lighting, dark moody atmosphere, 8K detail, shallow depth of field"

# ─────────────────────────────────────────────────────
# Voice Intelligence
# ─────────────────────────────────────────────────────
voice:
  pace: "slightly fast, approximately 160 words per minute"
  energy: "confident and authoritative but never robotic or monotone"
  style: "think MKBHD meets a Reuters news anchor"

  suggested_voices:
    edge_tts:
      en: "en-US-EricNeural"
      hi: "hi-IN-MadhurNeural"
    elevenlabs:
      voice_id: "JBFqnCBsd6RMkjVDRZzb"
      settings:
        stability: 0.4
        similarity_boost: 0.85
        style: 0.3
    "60db":
      voice_id: "fbb75ed2-975a-40c7-9e06-38e30524a9a1"
      settings:
        stability: 40
        similarity: 85
        speed: 1.05
        enhance: true

# ─────────────────────────────────────────────────────
# Caption Intelligence
# ─────────────────────────────────────────────────────
captions:
  highlight_color: "#00FF88"
  text_color: "#FFFFFF"
  font_family: "Arial Black"
  font_size: 64
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"
  words_per_group: 4

# ─────────────────────────────────────────────────────
# Music Intelligence
# ─────────────────────────────────────────────────────
music:
  mood: "ambient electronic, subtle energy, no lyrics, no distracting melodies"
  energy: "medium"
  tags: ["ambient", "electronic", "tech", "cinematic", "dark"]
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

# ─────────────────────────────────────────────────────
# Thumbnail Intelligence
# ─────────────────────────────────────────────────────
thumbnail:
  style: "dark background, bold text, high contrast, one dominant visual element"
  text_color: "#FFFFFF"
  accent_color: "#00FF88"
  text_position: "left_aligned"
  max_words: 5
  font_style: "bold condensed sans serif"
  guidelines:
    - "Never put more than 5 words on a thumbnail"
    - "Text should be readable at 120px wide (mobile browse size)"
    - "One face or one object, never both competing"
    - "Dark backgrounds with bright text outperform light backgrounds in tech niche"

# ─────────────────────────────────────────────────────
# Topic Discovery
# ─────────────────────────────────────────────────────
discovery:
  reddit:
    subreddits: ["technology", "artificial", "MachineLearning", "singularity", "programming", "startups"]
  rss:
    feeds:
      - "https://hnrss.org/frontpage"
      - "https://techcrunch.com/feed"
      - "https://www.theverge.com/rss/index.xml"
  google_trends:
    category: "t"
    geo: ""
  youtube_trending:
    category_id: "28"
  hacker_news:
    enabled: true
    min_score: 100
